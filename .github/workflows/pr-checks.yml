name: PR Checks

on:
  pull_request:
    branches: ['master']

jobs:
  generate-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Generate OpenAPI Spec
        run: pnpm generate:openapi

      - name: Validate OpenAPI Spec is Up to Date
        run: |
          if ! git diff --quiet generated/openapi/; then
            echo "❌ OpenAPI spec is out of date!"
            echo "Run 'pnpm generate:openapi' locally and commit the changes."
            git diff generated/openapi/
            exit 1
          fi
          echo "✅ OpenAPI spec is up to date"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Lint
        run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Check Formatting with Prettier
        run: pnpm prettier --check .

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Unit Tests
        run: pnpm test

  integration:kitchencalm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run KitchenCalm Integration Tests
        run: pnpm test:integration:kitchencalm

  integration:shelfie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Shelfie Integration Tests
        run: pnpm test:integration:shelfie

  integration:db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Database Integration Tests
        run: pnpm test:integration:db
