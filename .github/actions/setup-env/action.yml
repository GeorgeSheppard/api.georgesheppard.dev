name: Setup Environment
description: Common setup steps for Node.js, pnpm, dependencies, and environment variables

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10.22.0

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Load environment variables
      run: grep -v '^#' .env.test | grep -v '^$' >> $GITHUB_ENV
      shell: bash
