services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: '${CLOUDFLARE_TOKEN}'
    depends_on:
      - api
  api:
    image: georgeshep/bord:api.georgesheppard.dev
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '5240:5240'
    env_file:
      - .env
    environment:
      NODE_ENV: 'production'
      PORT: '5240'
      DATABASE_HOST: 'db'
      DATABASE_PORT: '5432'
      RABBITMQ_HOST: 'queues'
      RABBITMQ_PORT: '5672'
    depends_on:
      db:
        condition: service_healthy
      queues:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # POSTGRES_PASSWORD: Without this line a random password is used
      POSTGRES_USER: '${DATABASE_USER}'
      POSTGRES_DB: '${DATABASE_DB}'
      POSTGRES_PASSWORD: '${DATABASE_PASSWORD}'
    # Shared memory the container can use
    shm_size: 128mb
    volumes:
      # Persists the DB to ./pgdata
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  queues:
    image: rabbitmq:4.0.5-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD}'
    volumes:
      # Persists data to ./rabbitmq
      - ./rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Management UI (15672) is reachable inside the docker network only (cloudflared
    # can reach it as http://queues:15672); not published to the host.

  scheduler:
    image: ubuntu:22.04
    container_name: scheduler
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./cronjobs:/etc/cron.d
    command: /bin/bash -c "apt-get update && apt-get install -y curl cron && cron -f"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: 'db'
    depends_on:
      db:
        condition: service_healthy
    # Reachable inside the docker network only, as http://adminer:8080.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      queues:
        condition: service_healthy
